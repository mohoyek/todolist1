name: backend
description: ToDoList Backend with Shelf, WebSocket, SQLite, and JWT Auth
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.1              # HTTP server
  shelf_router: ^1.1.4       # Routing
  shelf_web_socket: ^1.0.4   # WebSocket support
  web_socket_channel: ^2.4.0 # WebSocket communication
  sqlite3: ^2.1.0            # SQLite database
  path: ^1.8.3               # Path utilities
  dart_jsonwebtoken: ^2.11.0 # JWT authentication
  crypto: ^3.0.3             # Cryptography for JWT
  bcrypt: ^1.1.3             # Password hashing
  uuid: ^4.2.1               # Unique ID generation
  http_parser: ^4.0.2        # HTTP parsing
  cors_headers: ^1.3.0       # CORS support

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
