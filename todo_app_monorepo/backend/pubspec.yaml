name: backend
description: ToDoList Backend with Shelf, WebSocket, SQLite, and JWT Auth
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_web_socket: ^1.0.4
  web_socket_channel: ^2.4.0
  sqlite3: ^2.1.0
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.8.3
  dart_jsonwebtoken: ^2.11.0
  crypto: ^3.0.3
  bcrypt: ^1.1.3
  uuid: ^4.2.1
  http_parser: ^4.0.2
  cors_headers: ^1.3.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
